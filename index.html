<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>청평의 방명록</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">DAY 1 — DAY 8 · PYTHON</p>
      <h1>청평의 방명록</h1>
      <p>청평의 AI교육 성공적인 수료를 위해 응원글을 남겨주세요</p>
    </header>
    <section class="write" aria-labelledby="write-title">
      <h2 id="write-title">인사 남기기</h2>
      {{error}}
      <form action="/entries" method="post" accept-charset="UTF-8">
        <label for="name">이름 <span>최대 20자</span></label>
        <input id="name" name="name" maxlength="20" required value="{{name}}" autocomplete="nickname">
        <label for="message">내용 <span>최대 500자</span></label>
        <textarea id="message" name="message" rows="4" maxlength="500" required>{{message}}</textarea>
        <p class="hint">모든 글은 공개됩니다. 연락처 등 개인정보는 남기지 마세요.</p>
        <button type="submit">방명록 남기기</button>
      </form>
    </section>
    <section aria-labelledby="entries-title">
      <h2 id="entries-title">남겨진 인사 <span>{{count}}개</span></h2>
      {{entries}}
      <nav aria-label="방명록 페이지">{{navigation}}</nav>
    </section>
    <footer>작은 응원글 하나가 청평이를 웃게 만듭니다.</footer>
  </main>
</body>
</html>
