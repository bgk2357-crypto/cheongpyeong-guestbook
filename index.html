<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>청평의 방명록</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">CHEONGPYEONG’S GUESTBOOK</p>
      <h1>청평의 방명록</h1>
      <p>청평의 AI교육 성공적인 수료를 위해 응원글을 남겨주세요</p>
    </header>
    <div class="guestbook-layout">
    <section class="write panel" aria-labelledby="write-title">
      <p class="section-label">LEAVE A LITTLE CHEER</p>
      <h2 id="write-title">응원 남기기</h2>
      <p class="section-description">청평이의 새로운 항해에 힘을 보태주세요.</p>
      {{error}}
      <form action="/entries" method="post" accept-charset="UTF-8">
        <label for="name">이름 <span>최대 20자</span></label>
        <input id="name" name="name" maxlength="20" required value="{{name}}" autocomplete="nickname">
        <label for="message">응원글 <span>최대 500자</span></label>
        <textarea id="message" name="message" rows="6" maxlength="500" required placeholder="따뜻한 응원 한마디를 남겨주세요.">{{message}}</textarea>
        <p class="hint">모든 글은 공개됩니다. 연락처 등 개인정보는 남기지 마세요.</p>
        <button type="submit">응원글 남기기 <span aria-hidden="true">↗</span></button>
      </form>
    </section>
    <section class="entries-panel panel" aria-labelledby="entries-title">
      <div class="list-heading">
        <div>
          <p class="section-label">MESSAGES ON THE WAVES</p>
          <h2 id="entries-title">도착한 응원 <span>{{count}}개</span></h2>
        </div>
        <span class="sort-label">최신순</span>
      </div>
      <div class="entries-list">{{entries}}</div>
      <nav aria-label="방명록 페이지">{{navigation}}</nav>
    </section>
    </div>
    <footer>작은 응원글 하나가 청평이를 웃게 만듭니다.</footer>
  </main>
</body>
</html>
